# Distribution hubs. The company supplied no hub list, so these are assumed hubs
# at real US logistics cities (see spec 001, FR-002). Coordinates are city centers.
# county_fips is used to look up FEMA National Risk Index county data.
# The region is NOT set here: it is derived from the state using [regions] below.

