[project]
name = "weather-risk"
version = "0.1.0"
description = "Weather Risk Intelligence Agent: deterministic hub exposure scoring with a conversational agent on top"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "typer",
    "pyyaml",
]

[project.scripts]
wra = "weather_risk.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_risk", "evals"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Typer and FastAPI use calls in argument defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["plausibility: checks scores against known US climate, run on the real seed snapshot"]
